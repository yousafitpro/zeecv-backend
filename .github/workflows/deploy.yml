name: 🚀 Deploy to EC2 on Push

on:
  push:
    branches:
      - main-v2  # ✅ Triggers only on this branch now

jobs:
  deploy:
    name: SSH into EC2 and deploy
    runs-on: ubuntu-latest

    steps:
      - name: 🧬 Connect and Deploy
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}       # ✅ Your EC2 public IP or domain
          username: ${{ secrets.EC2_USER }}   # ✅ e.g., "ubuntu"
          key: ${{ secrets.EC2_SSH_KEY }}     # ✅ Private SSH key (starts with -----BEGIN...)

          script: |
            cd /home/ubuntu/temp-yousafitlay  # ✅ Your project directory on EC2
            git fetch origin main-v2 && \
            git checkout main-v2 && \
            git pull origin main-v2 && \
            docker system prune -a -f --volumes && \
            sudo journalctl --vacuum-time=3d && \
            sudo apt-get clean && \
            docker-compose down && \
            docker-compose build --no-cache && \
            docker-compose up -d && \
            docker-compose exec app bash -c "chown -R www-data:www-data storage bootstrap/cache && chmod -R 775 storage bootstrap/cache"

