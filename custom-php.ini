; Increase upload and post limits
upload_max_filesize = 2G
post_max_size = 2G

; Increase input variables
max_input_vars = 5000

; Increase memory limit and execution time
memory_limit = 2G
max_execution_time = 600

; Enable file uploads (in case disabled)
file_uploads = On

; Set the maximum allowed size for uploaded files
max_file_uploads = 20

; Other important settings
max_input_time = 600
default_socket_timeout = 600
